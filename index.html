<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="설비 가동음을 점검하고 분석 리포트를 확인하는 10초만">
    <title>10초만</title>
    <link rel="icon" href="assets/icon-512.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icon-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/demo.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/story-report.css">
    <link rel="stylesheet" href="css/welding-report.css">
    <link rel="stylesheet" href="css/report-chat.css">
    <script src="js/demo-data.js" defer></script>
    <script src="js/demo-views.js" defer></script>
    <script src="js/device-management.js" defer></script>
    <script src="js/inventory.js" defer></script>
    <script src="js/story-report.js" defer></script>
    <script src="js/welding-signal.js" defer></script>
    <script src="js/welding-case.js" defer></script>
    <script src="js/report-chat.js" defer></script>
    <script src="js/welding-report.js" defer></script>
    <script src="js/demo.js" defer></script>
</head>
<body>
    <div class="app-shell" id="demo-app">
        <main id="main-screen" class="main-screen">
            <section id="home-screen" class="home-screen" aria-label="10초만 홈">
                <h1 id="home-greeting" class="home-greeting" hidden>
                    <span id="home-greeting-name" class="home-greeting-name" aria-hidden="true"></span>
                    <span id="home-greeting-message" class="home-greeting-message" aria-hidden="true">오늘도 안전하게 시작해 볼까요?</span>
                </h1>
                <div class="signal">
                    <div class="signal-waves" aria-hidden="true">
                        <span class="signal-wave"></span>
                        <span class="signal-wave"></span>
                    </div>
                    <div id="home-scan-progress" class="home-scan-progress" role="progressbar" aria-label="장비 점검 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
                        <svg viewBox="0 0 248 248" aria-hidden="true">
                            <defs>
                                <radialGradient id="scan-arc-color" gradientUnits="userSpaceOnUse" cx="124" cy="124" r="124">
                                    <stop offset="81.5%" stop-color="#78b9e9" stop-opacity="0" />
                                    <stop offset="86%" stop-color="#76c3eb" stop-opacity=".42" />
                                    <stop offset="89%" stop-color="#69bbe8" stop-opacity=".78" />
                                    <stop offset="94%" stop-color="#7ac5ed" stop-opacity=".82" />
                                    <stop offset="98%" stop-color="#a0d6f2" stop-opacity=".38" />
                                    <stop offset="100%" stop-color="#a0d6f2" stop-opacity="0" />
                                </radialGradient>
                                <filter id="scan-arc-edge" x="-10%" y="-10%" width="120%" height="120%">
                                    <feGaussianBlur stdDeviation="2" />
                                </filter>
                                <mask id="scan-arc-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="248" height="248">
                                    <circle id="home-scan-ring" class="scan-arc" cx="124" cy="124" r="114" pathLength="100" filter="url(#scan-arc-edge)" />
                                </mask>
                            </defs>
                            <circle class="scan-track" cx="124" cy="124" r="124" fill="url(#scan-arc-color)" />
                            <circle cx="124" cy="124" r="124" fill="url(#scan-arc-color)" mask="url(#scan-arc-mask)" />
                        </svg>
                    </div>
                    <button id="scan-button" class="scan-button" type="button" data-action="scan" aria-label="점검 시작">
                        <img src="assets/icon_bars.svg" alt="" width="64" height="64" draggable="false">
                    </button>
                    <span class="visually-hidden" id="home-scan-status" role="status"></span>
                </div>
            </section>
            <section id="inventory-screen" class="inventory-screen" aria-label="내 장비" hidden></section>
            <section id="settings-screen" class="settings-screen" aria-label="설정" hidden></section>
        </main>

        <div id="sheet-layer" class="sheet-layer" inert aria-hidden="true">
            <button type="button" class="sheet-scrim" data-action="close-sheet" aria-label="창 닫기" tabindex="-1"></button>
            <section id="app-sheet" class="app-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
                <div class="sheet-grip" id="sheet-grip" aria-hidden="true"><span></span></div>
                <header class="sheet-header">
                    <button id="sheet-back" class="icon-button sheet-back" type="button" data-action="back-sheet" aria-label="이전 화면" hidden></button>
                    <h1 id="sheet-title"></h1>
                    <div id="sheet-actions" class="sheet-actions"></div>
                </header>
                <div id="sheet-body" class="sheet-body"></div>
            </section>
        </div>

        <nav id="app-nav" class="app-nav" aria-label="주 메뉴">
            <button type="button" data-tab="home" aria-current="page"><span class="nav-icon" aria-hidden="true"></span>홈</button>
            <button type="button" data-tab="inventory"><span class="nav-icon" aria-hidden="true"></span>내 장비</button>
            <button type="button" data-tab="settings"><span class="nav-icon" aria-hidden="true"></span>설정</button>
        </nav>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
</body>
</html>
